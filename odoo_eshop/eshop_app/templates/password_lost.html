{% extends 'base.html' %}

{% block container %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <h2 class="text-center mb-4">
                <i class="bi bi-unlock me-2"></i>{{ _('Recover Password') }}
            </h2>

            <form method="POST" action="{{ url_for('password_lost') }}">
                <div class="form-floating mb-3">
                    <input 
                        type="email" 
                        name="login" 
                        id="login" 
                        class="form-control input-required" 
                        placeholder="{{ _('Email') }}" 
                        value="{{ request.form['login'] }}"
                        required
                    >
                    <label for="login">{{ _('Email') }}</label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        {{ _('Send Reset Link') }}
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
