{% extends 'base.html' %}

{% block container %}
<script>
    $('#nav_account').addClass('active');
</script>

<div class="container account">

    <form class="needs-validation" method="POST" action="{{ url_for('account') }}">

        <h1>{{ _('Personnal Datas') }}</h1>

        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" id="account_name" value="{{ partner.name|empty_if_null }}" readonly>
                <label for="account_name">{{ _('Name') }}</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" class="form-control" id="account_email" name="email" value="{{ partner.email|empty_if_null }}" readonly>
                <label for="account_email">{{ _('Email') }}</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="tel" class="form-control" id="account_mobile" name="mobile" value="{{ partner.mobile|empty_if_null }}">
                <label for="account_mobile">{{ _('Cell Phone') }}</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="tel" class="form-control" id="account_phone" name="phone" value="{{ partner.phone|empty_if_null }}">
                <label for="account_phone">{{ _('Other Phone') }}</label>
            </div>
            <div class="col-12 form-floating">
                <input type="text" class="form-control" id="account_street" name="street" value="{{ partner.street|empty_if_null }}">
                <label for="account_street">{{ _('Street') }}</label>
            </div>
            <div class="col-12 form-floating">
                <input type="text" class="form-control" id="account_street2" name="street2" value="{{ partner.street2|empty_if_null }}">
                <label for="account_street2">{{ _('Street (Extra Info)') }}</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" id="account_zip" name="zip" value="{{ partner.zip|empty_if_null }}">
                <label for="account_zip">{{ _('ZIP Code') }}</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" class="form-control" id="account_city" name="city" value="{{ partner.city|empty_if_null }}">
                <label for="account_city">{{ _('City') }}</label>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                {{ _('Update datas') }}
            </button>
        </div>
    </form>

    <form class="needs-validation" method="POST" action="{{ url_for('account_password') }}">

        <h1 id="password_change" class="mt-5">{{ _('Password') }}</h1>

        <div class="col-md-6">
            <div class="form-floating position-relative">
                <input type="password" class="form-control input-required account_data" id="password_1" name="password_1" value="{{ request.form['password_1']}}" required>
                <label for="password_1" class="required">{{ _('Password') }}</label>
                <span class="position-absolute top-50 end-0 translate-middle-y pe-3" onclick="togglePassword()" style="cursor:pointer;">
                    <i class="bi bi-eye" id="toggleIcon"></i>
                </span>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                {{ _('Update password') }}
            </button>
        </div>
    </form>

</div>

<script>
function togglePassword() {
    const input = document.getElementById("password_1");
    const icon = document.getElementById("toggleIcon");
    const isVisible = input.type === "text";

    input.type = isVisible ? "password" : "text";
    icon.className = isVisible ? "bi bi-eye" : "bi bi-eye-slash";
}
</script>

{% endblock %}
